body: aboutSkills の「業務知識」に「医療系の業務システムの開発経験」（:67）を挙げている一方、Notice の「お受けできないご依頼」に「医療ソフトウェアに関するご依頼（本業と競合するため）」（:92）がある。医療系の訪問者が About を読んで医療系の依頼を検討し、後で Notice で断られる流れになり得る。
