body: "The 'free' message is written in three places (heroLead, heroCta, servicesNote). The second sentence of servicesNote repeats flowNote ('料金は内容に応じて個別にお見積もりします') word for word. 故障シナリオ: If the free-consultation policy or the estimate wording changes, three or four strings must be edited together. CLAUDE.md already warns that terms must be changed in every place they appear. Missing one leaves the page contradicting itself.（出典: /code-review）"
