body: 差分で Services から「自社アプリの開発・公開」を外し（FR-4）、「仮の文言」を示す TODO コメントも削除した。一方 CLAUDE.md は「初回公開の範囲」で Services を「アプリ開発の受託／AI活用の相談／自社アプリ」と書き、未決事項に「キャッチコピー、サービス説明の文言（現在は仮の文言）」を残している。spec §8 は「CLAUDE.md の未決事項は、この Issue で決まったら更新する」としているが、文言は PR で確認する段階のため、コード側だけ確定扱いになっている。
