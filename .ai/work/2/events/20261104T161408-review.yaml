body: ".services__lead uses a negative top margin (-1rem) to cancel the global .section-title bottom margin of 2rem. 故障シナリオ: If the .section-title margin in global.css changes (for example to 1rem), the lead text overlaps or sits against the heading. A scoped modifier on the title, or a heading-plus-lead wrapper, would avoid depending on the global value.（出典: /code-review）"
