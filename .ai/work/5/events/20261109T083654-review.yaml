summary: NDA の答えの「ご相談の内容をお伺いする前に結ぶこともできます」は、問診で確かめた事実の範囲を超えた約束になっている
body: "FAQ の NDA の答え 'はい、結べます。ご相談の内容をお伺いする前に結ぶこともできます。' の後半は、Issue #5（「NDA」とだけ書かれている）にも問診の回答にも無い取引条件で、仕様書 §8 の「事実は §3 の範囲を超えない」の外にある。相談前の NDA は、無料の相談の段階で契約の手間を約束することになり、副業の対応時間とのかね合いもある。モック（mock-A.html）には同じ文があったが、ユーザーが確認したのは Q1〜Q3 の 3 点だけ。"
