body: "The FAQ `<summary>` uses `display: flex`, which older WebKit versions did not apply reliably to summary elements, while only `::-webkit-details-marker` is hidden. / 故障シナリオ: On older iOS Safari the summary may fall back to its default display, showing both the native disclosure triangle and the custom '+' marker, or wrapping the 'Q' onto its own line.（出典: /code-review）"
